name: keitaro-wrapper

services:
  postgres:
    image: postgres:16
    ports:
      - "127.0.0.1:5432:5432"
    env_file:
      - path: backend/.env
        required: true
    volumes:
      - pg_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s

volumes:
  pg_data_dev:
